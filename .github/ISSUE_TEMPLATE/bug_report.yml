name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove transcripts, audio, credentials, hostnames, usernames, and private paths before submitting.
        Report security vulnerabilities through SECURITY.md instead of this form.
  - type: input
    id: version
    attributes:
      label: MeetScribe version
      description: Release number or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and hardware
      placeholder: macOS 15.6, Apple M2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording trigger
        - Audio capture
        - Transcription
        - Transcript agent
        - Git destination
        - SFTP destination
        - Setup or permissions
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure...
        2. Start...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed transcripts, audio, credentials, hostnames, usernames, and other private data.
          required: true
